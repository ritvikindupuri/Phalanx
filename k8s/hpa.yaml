apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nano-vllm-autoscaler
  namespace: ai-workloads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nano-vllm-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # 1. Standard CPU Utilization Scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    # 2. Memory Saturation Scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
