apiVersion: apps/v1
kind: Deployment
metadata:
  name: nano-vllm-inference
  namespace: ai-workloads
  labels:
    app.kubernetes.io/name: nano-vllm
    app.kubernetes.io/component: inference-engine
    security.ai/profile: hardened-restricted
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nano-vllm-inference
  template:
    metadata:
      labels:
        app: nano-vllm-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Pod Security Standards: Restricted Profile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        # 1. AI Security Gateway Sidecar (Firewall & Guardrails)
        - name: ai-security-gateway
          image: ghcr.io/your-org/ai-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway.proxy:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http-gateway
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

        # 2. PagedAttention Inference Engine Core
        - name: inference-engine
          image: ghcr.io/your-org/nano-vllm:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "server.app:app", "--host", "127.0.0.1", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http-engine
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MODEL_NAME
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: NUM_KV_BLOCKS
              value: "256"
            - name: BLOCK_SIZE
              value: "16"
            - name: HF_HOME
              value: "/tmp/huggingface"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: model-cache
              mountPath: /tmp/huggingface

      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: 10Gi
