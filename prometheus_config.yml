global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "ai-security-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: "phalanx-inference-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]
